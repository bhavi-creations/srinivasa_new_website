<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Srinivasa Dental Logo</title>

<style>
:root {
  --logo-bg: #061636;
  --gold: #d4a24c;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--logo-bg);
  font-family: Arial, sans-serif;
}

.dental-logo {
  width: 100%;
  min-height: 330px;
  background: var(--logo-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 70px;
  padding: 45px 70px;
}

/* Icon Alignment Fixed */
.logo-icon {
  width: 245px;
  height: 245px;
  flex: 0 0 245px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translateY(-8px);
}

.logo-icon svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

/* Text */
.logo-text {
  min-width: 720px;
  text-align: center;
}

.logo-text h1 {
  margin: 0;
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 88px;
  font-weight: 500;
  letter-spacing: 20px;
  line-height: 1;
}

.dental-row {
  margin-top: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 45px;
}

.dental-row .line {
  width: 170px;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(212, 162, 76, 0.95),
    transparent
  );
}

.dental-row h2 {
  margin: 0;
  color: var(--white);
  font-family: Arial, sans-serif;
  font-size: 42px;
  font-weight: 600;
  letter-spacing: 24px;
  line-height: 1;
  padding-left: 24px;
}

.logo-text p {
  margin: 32px 0 0;
  color: var(--gold);
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 17px;
  line-height: 1.2;
  padding-left: 17px;
}

/* Responsive */
@media (max-width: 1200px) {
  .dental-logo {
    gap: 45px;
    padding: 40px;
  }

  .logo-icon {
    width: 190px;
    height: 190px;
    flex-basis: 190px;
    transform: translateY(-6px);
  }

  .logo-text {
    min-width: 560px;
  }

  .logo-text h1 {
    font-size: 64px;
    letter-spacing: 14px;
  }

  .dental-row h2 {
    font-size: 30px;
    letter-spacing: 17px;
    padding-left: 17px;
  }

  .dental-row .line {
    width: 120px;
  }

  .logo-text p {
    font-size: 17px;
    letter-spacing: 11px;
    padding-left: 11px;
  }
}

@media (max-width: 768px) {
  .dental-logo {
    flex-direction: column;
    gap: 25px;
    padding: 35px 20px;
  }

  .logo-icon {
    width: 170px;
    height: 170px;
    flex-basis: 170px;
    transform: translateY(0);
  }

  .logo-text {
    min-width: auto;
    width: 100%;
  }

  .logo-text h1 {
    font-size: 42px;
    letter-spacing: 8px;
  }

  .dental-row {
    gap: 18px;
    margin-top: 18px;
  }

  .dental-row .line {
    width: 70px;
  }

  .dental-row h2 {
    font-size: 22px;
    letter-spacing: 10px;
    padding-left: 10px;
  }

  .logo-text p {
    font-size: 12px;
    letter-spacing: 5px;
    padding-left: 5px;
  }
}
</style>
</head>

<body>

<div class="dental-logo">

  <!-- SVG Icon Start -->
  <div class="logo-icon">
    <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">

      <defs>

          <stop offset="60%" stop-color="#f3cf78"/>
          <stop offset="100%" stop-color="#9c6a22"/>

        <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">

          <stop offset="100%" stop-color="#b77b2e"/>
        </linearGradient>

        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
      </defs>

      <g filter="url(#softShadow)" transform="translate(0,-4)">

        <!-- Crown -->
        <path d="M98 54 L88 23 L112 43 L130 10 L148 43 L172 23 L162 54 Z"
              fill="url(#goldGrad)" stroke="#7b511b" stroke-width="1.5"/>

        <rect x="95" y="54" width="70" height="10" rx="2"
              fill="url(#goldGrad)" stroke="#7b511b" stroke-width="1.5"/>

        <circle cx="103" cy="50" r="4" fill="#061636"/>
        <circle cx="119" cy="50" r="4" fill="#061636"/>
        <circle cx="141" cy="50" r="4" fill="#061636"/>
        <circle cx="157" cy="50" r="4" fill="#061636"/>

        <!-- Outer Heart Tooth Shape -->
        <path d="
          M130 84
          C108 52 55 62 48 105
          C42 145 70 177 105 182
          C117 184 124 174 130 164
          C136 174 143 184 155 182
          C190 177 218 145 212 105
          C205 62 152 52 130 84
          Z"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"/>

        <!-- Inner Highlight Heart Stroke -->
        <path d="
          M130 88
          C112 64 70 70 62 106
          C57 136 76 160 105 169
          M130 88
          C148 64 190 70 198 106
          C203 136 184 160 155 169"
          fill="none"
          stroke="#f7d889"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.75"/>

        <!-- Inner Tooth / S Shape -->
        <path d="
          M153 107
          C145 100 132 98 120 104
          C109 109 103 119 109 128
          C115 137 132 136 140 142
          C149 149 144 164 130 171"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="8"
          stroke-linecap="round"/>

        <path d="
          M107 106
          C115 102 126 101 136 105"
          fill="none"
          stroke="#f9dfa0"
          stroke-width="3"
          stroke-linecap="round"/>

        <!-- Tooth Roots -->
        <path d="M112 142 C107 155 108 170 109 184"
              fill="none"
              stroke="url(#goldGrad)"
              stroke-width="8"
              stroke-linecap="round"/>

        <path d="M148 142 C153 155 152 170 151 184"
              fill="none"
              stroke="url(#goldGrad)"
              stroke-width="8"
              stroke-linecap="round"/>

        <!-- Side Decorative Leaves Left -->
        <path d="M48 174 C32 170 23 160 18 149"
              fill="none"
              stroke="url(#goldGrad)"
              stroke-width="4"
              stroke-linecap="round"/>

        <circle cx="21" cy="151" r="4" fill="url(#goldGrad)"/>
        <circle cx="32" cy="160" r="4" fill="url(#goldGrad)"/>
        <circle cx="43" cy="166" r="4" fill="url(#goldGrad)"/>

        <!-- Side Decorative Leaves Right -->
        <path d="M212 174 C228 170 237 160 242 149"
              fill="none"
              stroke="url(#goldGrad)"
              stroke-width="4"
              stroke-linecap="round"/>

        <circle cx="239" cy="151" r="4" fill="url(#goldGrad)"/>
        <circle cx="228" cy="160" r="4" fill="url(#goldGrad)"/>
        <circle cx="217" cy="166" r="4" fill="url(#goldGrad)"/>

        <!-- Bottom Ornament Base -->
        <path d="M83 197 C96 205 164 205 177 197"
              fill="none"
              stroke="url(#goldGrad)"
              stroke-width="6"
              stroke-linecap="round"/>

        <path d="M78 201 C98 214 162 214 182 201"
              fill="none"
              stroke="url(#goldDark)"
              stroke-width="3"
              stroke-linecap="round"/>

        <circle cx="130" cy="202" r="8" fill="url(#goldGrad)" stroke="#7b511b" stroke-width="2"/>

        <path d="M70 199 C57 197 57 187 68 188"
              fill="none"
              stroke="url(#goldGrad)"
              stroke-width="4"
              stroke-linecap="round"/>

        <path d="M190 199 C203 197 203 187 192 188"
              fill="none"
              stroke="url(#goldGrad)"
              stroke-width="4"
              stroke-linecap="round"/>

        <!-- M Letters -->
        <text x="76" y="238"
              text-anchor="middle"
              font-family="Georgia, serif"
              font-size="36"
              font-weight="700"
              fill="url(#goldGrad)">M</text>

        <text x="184" y="238"
              text-anchor="middle"
              font-family="Georgia, serif"
              font-size="36"
              font-weight="700"
              fill="url(#goldGrad)">M</text>

      </g>
    </svg>
  </div>
  <!-- SVG Icon End -->

  <!-- Text Start -->
  <div class="logo-text">
    <h1>SRINIVASA</h1>

    <div class="dental-row">
      <span class="line"></span>
      <h2>DENTAL</h2>
      <span class="line"></span>
    </div>

    <p>SMILES THAT LAST FOREVER</p>
  </div>
  <!-- Text End -->

</div>

</body>
</html>
