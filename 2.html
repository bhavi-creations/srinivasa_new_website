<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Srinivasa Dental Logo</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --navy: #061636;
      --gold: #d4a24c;
      --white: #ffffff;
    }

    body {
      margin: 0;
      background: var(--navy);
      font-family: Arial, sans-serif;
    }

    .logo-section {
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .srinivasa-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 70px;
      width: 100%;
      max-width: 1250px;
    }

    /* Exact Icon */
    .srinivasa-icon {
      width: 280px;
      height: 280px;
      flex: 0 0 280px;
      display: block;
    }

    .srinivasa-icon image {
      width: 100%;
      height: 100%;
    }

    .logo-content {
      text-align: center;
    }

    .brand-name {
      margin: 0;
      color: var(--white);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 92px;
      font-weight: 500;
      letter-spacing: 21px;
      line-height: 1;
    }

    .dental-row {
      margin-top: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 42px;
    }

    .dental-line {
      width: 170px;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(212, 162, 76, 0.95),
        transparent
      );
    }

    .brand-type {
      margin: 0;
      color: var(--white);
      font-size: 44px;
      font-weight: 600;
      letter-spacing: 25px;
      line-height: 1;
      padding-left: 25px;
    }

    .tagline {
      margin-top: 38px;
      color: var(--gold);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 17px;
      line-height: 1.2;
      padding-left: 17px;
    }

    @media (max-width: 1200px) {
      .srinivasa-logo {
        gap: 45px;
      }

      .srinivasa-icon {
        width: 220px;
        height: 220px;
        flex-basis: 220px;
      }

      .brand-name {
        font-size: 68px;
        letter-spacing: 15px;
      }

      .brand-type {
        font-size: 34px;
        letter-spacing: 18px;
        padding-left: 18px;
      }

      .dental-line {
        width: 125px;
      }

      .tagline {
        font-size: 18px;
        letter-spacing: 11px;
        padding-left: 11px;
      }
    }

    @media (max-width: 768px) {
      .srinivasa-logo {
        flex-direction: column;
        gap: 25px;
      }

      .srinivasa-icon {
        width: 210px;
        height: 210px;
        flex-basis: 210px;
      }

      .brand-name {
        font-size: 42px;
        letter-spacing: 8px;
      }

      .dental-row {
        margin-top: 22px;
        gap: 18px;
      }

      .dental-line {
        width: 65px;
      }

      .brand-type {
        font-size: 22px;
        letter-spacing: 10px;
        padding-left: 10px;
      }

      .tagline {
        margin-top: 22px;
        font-size: 12px;
        letter-spacing: 5px;
        padding-left: 5px;
      }
    }
  </style>
</head>

<body>

  <section class="logo-section">
    <div class="container-fluid">
      <div class="srinivasa-logo">

        <!-- Exact Icon in SVG Wrapper -->
        <svg class="srinivasa-icon" viewBox="0 0 530 530" xmlns="http://www.w3.org/2000/svg">
          <image 
            href="assets/images/srinivasa-icon.jpeg" 
            x="0" 
            y="0" 
            width="530" 
            height="530" 
            preserveAspectRatio="xMidYMid meet"
          />
        </svg>

        <div class="logo-content">
          <h1 class="brand-name">SRINIVASA</h1>

          <div class="dental-row">
            <span class="dental-line"></span>
            <h2 class="brand-type">DENTAL</h2>
            <span class="dental-line"></span>
          </div>

          <div class="tagline">
            SMILES THAT LAST FOREVER
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
